# Listen on Wi-Fi and on this laptop itself
interface=en0
interface=lo0

# Our private domain: answer it ourselves, never forward it
local=/teamX.test/
host-record=app.teamX.test,10.7.27.219
host-record=api.teamX.test,10.7.27.219
local-ttl=60

# Everything else is forwarded to public DNS
no-resolv
server=8.8.8.8
server=1.1.1.1

# Log every query to a file (useful evidence)
log-queries
log-facility=/tmp/dnsmasq.log
