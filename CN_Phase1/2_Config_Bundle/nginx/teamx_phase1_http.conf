# The two backend servers (the "upstream" group)
upstream backends {
    # Round robin by default: A, B, A, B...
    # max_fails/fail_timeout = passive health check: skip a dead backend for 10s
    server 10.7.27.219:3001 max_fails=1 fail_timeout=10s;   # Backend A (Laptop 1)
    server 10.7.5.228:3002  max_fails=1 fail_timeout=10s;   # Backend B (Laptop 2)
}

server {
    listen 80;
    server_name app.teamX.test api.teamX.test;

    location / {
        proxy_pass http://backends;

        # Pass the original request details to the backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Fail fast and retry on the other backend if one is down
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502;

        # Show which backend address handled the request (evidence)
        add_header X-Upstream $upstream_addr always;
    }
}
